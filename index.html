    <!-- Critical CSS (inline for performance) -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { background-color: #FAFAFF; font-family: 'Vazirmatn', 'Inter', system-ui, sans-serif; }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* Loading state */
      .app-loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #FAFAFF; }
      .app-loading-spinner { width: 40px; height: 40px; border: 3px solid #E0D4FF; border-top-color: #8B5CF6; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <div id="root">
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
