<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اسکای‌چی | آفلاین</title>
  <meta name="theme-color" content="#8B5CF6" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: #FAFAFF;
      background-image: 
        radial-gradient(at 20% 0%, #FFE0F0 0%, transparent 50%),
        radial-gradient(at 80% 30%, #D4E4FF 0%, transparent 50%),
        radial-gradient(at 50% 100%, #E0D4FF 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(15, 15, 20, 0.08);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 600; color: #0F0F14; margin-bottom: 12px; }
    p { font-size: 14px; color: #5A5A68; line-height: 1.7; margin-bottom: 24px; }
    button {
      background: #8B5CF6;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    button:hover { background: #7C3AED; }
    button:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>آفلاین</h1>
    <p>
      اتصال به اینترنت برقرار نیست.<br />
      لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.
    </p>
    <button onclick="window.location.reload()">تلاش مجدد</button>
  </div>
</body>
</html>
