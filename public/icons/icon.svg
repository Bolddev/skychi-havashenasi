<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Sun rays -->
  <g opacity="0.3">
    <circle cx="256" cy="220" r="120" fill="#FCD34D"/>
  </g>
  
  <!-- Sun -->
  <circle cx="256" cy="220" r="80" fill="url(#sun)"/>
  
  <!-- Cloud (glassmorphism effect) -->
  <g opacity="0.85">
    <ellipse cx="280" cy="300" rx="90" ry="50" fill="white"/>
    <ellipse cx="230" cy="290" rx="60" ry="45" fill="white"/>
    <ellipse cx="330" cy="295" rx="55" ry="40" fill="white"/>
  </g>
  
  <!-- Cloud highlight -->
  <g opacity="0.4">
    <ellipse cx="260" cy="280" rx="70" ry="30" fill="white"/>
  </g>
</svg>
